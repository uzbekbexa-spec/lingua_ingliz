<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nega Ingliz Tili Qiyin?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; }
        p { color: #555; }
        .question-box {
            margin: 20px 0;
            text-align: left;
        }
        select, input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn:hover { background-color: #219653; }
        .price-tag {
            font-size: 24px;
            color: #e74c3c;
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎯 Ingliz tilini o'rganishda nima uchun qiynalyapsiz?</h2>
        <p>Keling, sababini aniqlaymiz va sizga mos kursni tanlaymiz!</p>

        <div class="question-box">
            <label><b>1. Nega ingliz tili o'rganayapsiz?</b></label>
            <select>
                <option>Ish va karyera uchun</option>
                <option>Sayohat qilish uchun</option>
                <option>Imtihon (IELTS/Multilevel) uchun</option>
                <option>O'zim uchun / erkin muloqot</option>
            </select>
        </div>

        <div class="question-box">
            <label><b>2. Siz uchun eng qiyin narsa nima?</b></label>
            <select>
                <option>Gapirish (Speaking) - qo'rquv bor</option>
                <option>Tinglab tushunish (Listening)</option>
                <option>Grammatika va so'z boyligi</option>
                <option>Vaqt topish va tartib bilan o'qish</option>
            </select>
        </div>

        <div class="price-tag">Maxsus kurs: 149,000 UZS</div>
        <p>Sizga aynan shu kurs mos keladi! To'lovni amalga oshiring:</p>

        <div class="question-box">
            <label><b>Karta raqamingiz:</b></label>
            <input type="text" placeholder="9860166654965507" maxlength="19">
        </div>

        <button class="btn" onclick="alert('To\'lov sahifasiga o\'tmoqda!')">Kursni sotib olish (149,000 UZS)</button>
        
        <br><br>
        <a href="index.html" style="color: #3498db; text-decoration: none; font-weight: bold;">🏠 Asosiy sahifaga qaytish</a>
    </div>

</body>
</html>
